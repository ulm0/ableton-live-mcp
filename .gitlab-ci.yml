image: node:24

stages:
  - test
  - package

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

test:
  stage: test
  script:
    - npm ci --cache .npm --prefer-offline
    - npm test

package:
  stage: package
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run package
  artifacts:
    paths:
      - "*.ablx"
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
